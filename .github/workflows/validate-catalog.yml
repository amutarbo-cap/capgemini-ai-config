name: Validate Catalog

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate manifest paths
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f manifest.yaml ]; then
            echo "manifest.yaml not found"
            exit 1
          fi

          python - << 'PY'
          import os
          import sys
          import yaml

          with open('manifest.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          components = data.get('components', [])
          if not components:
              print('No components in manifest.yaml')
              sys.exit(1)

          missing = []
          for item in components:
              path = item.get('path')
              if not path or not os.path.exists(path):
                  missing.append(path or '<empty path>')

          if missing:
              print('Missing paths declared in manifest.yaml:')
              for p in missing:
                  print(f'- {p}')
              sys.exit(1)

          print(f'OK: validated {len(components)} components')
          PY

      - name: Validate markdown files exist
        shell: bash
        run: |
          set -euo pipefail

          for dir in catalog/agents catalog/skills catalog/sdd catalog/mcps; do
            if [ ! -d "$dir" ]; then
              echo "Missing directory: $dir"
              exit 1
            fi
          done
