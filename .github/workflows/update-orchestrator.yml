name: Update Orchestrator Registry

# Triggered automatically when manifest.yaml changes on main.
# Regenerates the AUTO-GENERATED Agent Registry table inside orchestrator.md.

on:
  push:
    branches:
      - main
    paths:
      - manifest.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to push back
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install pyyaml --quiet

      - name: Regenerate Agent Registry in orchestrator.md
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import re, yaml
          from pathlib import Path

          ORCHESTRATOR_PATH = Path("catalog/agents/orchestrator.md")
          MANIFEST_PATH     = Path("manifest.yaml")

          # ── Read manifest ────────────────────────────────────────────────────
          with open(MANIFEST_PATH, "r", encoding="utf-8") as f:
              manifest = yaml.safe_load(f)

          agents = [
              c for c in manifest.get("components", [])
              if c.get("type") == "agent"
              and c.get("id") != "agent-orchestrator"
          ]

          # Sort: active first, then by id
          agents.sort(key=lambda c: (c.get("status") != "active", c.get("id", "")))

          # ── Build table ──────────────────────────────────────────────────────
          header = "| ID | Ruta | Estado |\n|---|---|---|"
          rows   = "\n".join(
              f"| {c['id']} | {c['path']} | {c.get('status', 'unknown')} |"
              for c in agents
          )
          table = f"{header}\n{rows}"

          # ── Replace AUTO-GENERATED block ─────────────────────────────────────
          content = ORCHESTRATOR_PATH.read_text(encoding="utf-8")

          START_MARKER = "<!-- AUTO-GENERATED from manifest.yaml"
          END_MARKER   = "<!-- END AUTO-GENERATED -->"

          start_idx = content.find(START_MARKER)
          end_idx   = content.find(END_MARKER)

          if start_idx == -1 or end_idx == -1:
              raise RuntimeError(
                  "Could not find AUTO-GENERATED markers in orchestrator.md. "
                  "Ensure the file contains '<!-- AUTO-GENERATED from manifest.yaml' and '<!-- END AUTO-GENERATED -->'."
              )

          # Preserve the opening comment line
          start_block_end = content.index("-->", start_idx) + len("-->")
          new_block = (
              content[:start_idx]
              + START_MARKER
              + " — do not edit this section manually.\n"
              + "     Run `.github/workflows/update-orchestrator.yml` ou push a change to manifest.yaml para regenerar. -->\n\n"
              + table
              + "\n\n"
              + END_MARKER
              + content[end_idx + len(END_MARKER):]
          )

          ORCHESTRATOR_PATH.write_text(new_block, encoding="utf-8")
          print(f"✅ Updated Agent Registry with {len(agents)} agent(s).")
          for a in agents:
              print(f"   - {a['id']} ({a.get('status', 'unknown')})")
          PY

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain catalog/agents/orchestrator.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/agents/orchestrator.md
            git commit -m "chore(orchestrator): regenerate agent registry from manifest.yaml [skip ci]"
            git push
            echo "✅ orchestrator.md updated and pushed."
          else
            echo "No changes to orchestrator.md — registry is already up to date."
          fi
