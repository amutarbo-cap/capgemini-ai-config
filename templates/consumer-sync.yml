name: Sync AI Config

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA from central config repo
        required: false
        default: main
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4

      - name: Sync central AI config
        uses: amutarbo-cap/capgemini-ai-config/.github/actions/sync-ai-config@main
        with:
          source_repository: amutarbo-cap/capgemini-ai-config
          ref: ${{ github.event.inputs.ref || 'main' }}
          source_token: ${{ secrets.AI_CONFIG_SOURCE_TOKEN }}
          paths: catalog/agents,catalog/skills,catalog/sdd,catalog/mcps,manifest.yaml
          target_root: .ai-config
          clean_target: "false"

      - name: Create commit if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(ai-config): sync from central catalog"
            git push
          else
            echo "No changes to commit"
          fi
